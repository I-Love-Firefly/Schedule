### model
model_name_or_path: artifacts/models/MiniCPM5-1B
flash_attn: sdpa

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target: all

### dataset
dataset: schedule_layout_train
dataset_dir: artifacts/ai-data/layout-v1
template: qwen3_nothink
cutoff_len: 4096
max_samples: 1
preprocessing_num_workers: 1
overwrite_cache: true

### output
output_dir: artifacts/ai-training/minicpm5-layout-lora-smoke
logging_steps: 1
save_steps: 1
save_total_limit: 1
overwrite_output_dir: true
report_to: none

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 1
learning_rate: 1.0e-4
max_steps: 1
bf16: true
gradient_checkpointing: true
use_reentrant_gc: false
